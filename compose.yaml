services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchases}
      POSTGRES_USER: ${POSTGRES_USER:-purchases}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      MCP_PORT: "8081"
      CATALOG_TIMEOUT: ${CATALOG_TIMEOUT:-5s}
    ports:
      - "${MCP_PORT:-8081}:8081"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Defina OPENROUTER_API_KEY no .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      MCP_URL: http://mcp:8081/mcp
      API_PORT: "8080"
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      CATALOG_TIMEOUT: ${CATALOG_TIMEOUT:-5s}
      MAX_MODEL_CALLS: ${MAX_MODEL_CALLS:-8}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres_data:
