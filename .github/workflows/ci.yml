name: CI

on:
  push:
    branches: [main, feature/purchase-agent-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: purchases_test
          POSTGRES_USER: purchases_test
          POSTGRES_PASSWORD: ${{ github.sha }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U purchases_test -d purchases_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://purchases_test:${{ github.sha }}@localhost:5432/purchases_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend lint
        run: npm run format:check
      - name: Frontend build
        run: npm run build
